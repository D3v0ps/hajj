name: hajj

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hajj
      POSTGRES_USER: hajj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajj -d hajj"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${APP_IMAGE:-ghcr.io/d3v0ps/hajj:latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hajj:${POSTGRES_PASSWORD}@postgres:5432/hajj?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: https://${DOMAIN:-hajj.karimkhalil.se}
      APP_URL: https://${DOMAIN:-hajj.karimkhalil.se}
      AUTH_TRUST_HOST: "true"
      RUN_SEED: ${RUN_SEED:-1}
      SETUP_MODE: ${SETUP_MODE:-1}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - web
    volumes:
      - app-uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-hajj.karimkhalil.se}
      ACME_EMAIL: ${ACME_EMAIL:-info@hajj.karimkhalil.se}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - web
    depends_on:
      - app

volumes:
  postgres-data:
  app-uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
  web:
