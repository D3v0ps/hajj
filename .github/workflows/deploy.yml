name: Build and deploy

on:
  push:
    branches:
      - main
      - claude/hippo-memory-init-BxqGB
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: tag
        run: |
          REPO_LC="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image=ghcr.io/${REPO_LC}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=ghcr.io/${REPO_LC}:latest" >> "$GITHUB_OUTPUT"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.image_latest }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=UNLICENSED
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add server to known_hosts to avoid prompt
          ssh-keyscan -H -T 10 "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Sanity-print of key (header only — never print full key)
          head -1 ~/.ssh/deploy_key

      - name: Pre-flight SSH connectivity test
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo SSH_OK; whoami; uname -a; docker --version; cloud-init status 2>/dev/null || true"

      - name: Copy compose files to server
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            docker-compose.yml Caddyfile \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/app/

      - name: Deploy (write .env + docker login + pull + up + verify)
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/hajj:sha-${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_LC: ${{ github.repository }}
        run: |
          # Lowercasea repo + bygg image-tag exakt som build-jobbet
          REPO_LC_LOWER="$(echo "$REPO_LC" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${REPO_LC_LOWER}:sha-${SHORT_SHA}"
          echo "Deploying image: $IMAGE"

          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=5 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            APP_IMAGE="$IMAGE" \
            POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            AUTH_SECRET="$AUTH_SECRET" \
            SEED_ADMIN_EMAIL="$SEED_ADMIN_EMAIL" \
            SEED_ADMIN_PASSWORD="$SEED_ADMIN_PASSWORD" \
            GH_ACTOR="$GH_ACTOR" \
            GH_TOKEN="$GH_TOKEN" \
            bash -s <<'REMOTE'
          set -euo pipefail

          cd ~/app

          # Skriv .env på servern (safekvotat, inga heredoc-expansionsöverraskningar)
          umask 077
          {
            echo "APP_IMAGE=${APP_IMAGE}"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "AUTH_SECRET=${AUTH_SECRET}"
            echo "DOMAIN=hajj.karimkhalil.se"
            echo "ACME_EMAIL=info@hajj.karimkhalil.se"
            echo "SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-}"
            echo "SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-}"
            echo "RUN_SEED=1"
          } > .env

          # Logga in på GHCR med workflow-token (kräver packages: read i deploy-jobbet)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          # Pull och starta om
          docker compose pull
          docker compose up -d --remove-orphans

          # Status
          docker compose ps
          docker image prune -f --filter "until=72h" || true

          echo "Deploy step done on server."
          REMOTE

      - name: Health check
        run: |
          echo "Väntar på att appen ska svara på https://hajj.karimkhalil.se/api/health"
          for i in $(seq 1 18); do
            # -L följer redirects (HTTP→HTTPS via Caddy), -k tillåter självsignerat under ACME-vänteläge
            if curl -fsSL -k https://hajj.karimkhalil.se/api/health -o /tmp/health.json -m 10; then
              echo "Healthy on try $i:"
              cat /tmp/health.json
              exit 0
            fi
            if curl -fsSL http://hajj.karimkhalil.se/api/health -o /tmp/health.json -m 10 2>/dev/null; then
              echo "Healthy on HTTP (cert kanske ej klart än):"
              cat /tmp/health.json
              exit 0
            fi
            echo "Try $i/18: ej redo, väntar 10s..."
            sleep 10
          done
          echo "::warning::Appen blev inte healthy inom 3 min — kolla 'docker compose logs' på servern."
          exit 1
